<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventListner</title>
    <link rel="stylesheet" href="exercise_21_MIT_BOM_EventListner.css">
</head>
<body>
    <main>
        <div class="section">
            <h1>Hover Over the Cards</h1>
            <div class="cards">
                <div class="card">Card</div>
                <div class="card">Card</div>
                <div class="card">Card</div>
            </div>
        </div>
        <div class="buttonSection">
            <h2>Click and Hold</h2>
            <button>Press Me!</button>
            <!-- <p>Mouse button is currently held down</p> -->
        </div>
    </main>

    <script>
    const cards = document.querySelectorAll('.card');

    cards.forEach(card => {
        card.addEventListener("mouseenter", () => {
            card.classList.add("hoverCard");
            card.textContent = 'Hovered!';
        });
        card.addEventListener('mouseleave', () => {
            card.classList.remove('hoverCard');
            card.textContent = 'Card';
        });
    });

    const pressButton = document.querySelector('.buttonSection button');

    const pressPara = document.createElement('p');
    pressPara.textContent = 'Mouse button is currently held down';
    pressPara.style.color = 'rgb(218, 195, 121)';

    pressButton.addEventListener('mousedown', () => {
        pressButton.after(pressPara); 
    });

    pressButton.addEventListener('mouseup', () => {
        pressPara.remove();
    });

    pressButton.addEventListener('mouseleave', () => {
        pressPara.remove();
    });
</script>
    
</body>
</html>
