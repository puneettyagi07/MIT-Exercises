    <script>
      const header = document.querySelector("th");
      cosnole.log(header);

      const table = document.querySelector("table");
      const theader = document.querySelector("thead");
      const bodies = document.querySelector("tbody");
      const button = document.querySelector("button");

      // console.log(tableRow);

      table.style.fontSize = "16px";
      table.style.textAlign = "center";
      table.style.borderRadius = "24px 24px 0px 0px";

      header.style.backgroundColor = "black";
      header.style.color = "white";

      let ShowDataPromise = new Promise((resolve, reject) => {
        if (
          button.addEventListener("click", () => {
            button.textContent = "Wait 3 Sec...";
          })
        ) {
          setTimeout(() => {
            resolve();
          }, 2000);
        } else {
          reject();
        }
      });

      ShowDataPromise.then(() => {
        bodies.tbody.rows[0].tr.cells[0].textContent = "Puneet";
        bodies.tbody.rows[0].tr.cells[1].textContent = "12th";
        bodies.tbody.rows[0].tr.cells[2].textContent = "Computer Science";
        bodies.tbody.rows[0].tr.cells[3].textContent = "007";

        bodies.tbody.rows[1].tr.cells[0].textContent = "Puneet";
        bodies.tbody.rows[1].tr.cells[1].textContent = "12th";
        bodies.tbody.rows[1].tr.cells[2].textContent = "Computer Science";
        bodies.tbody.rows[1].tr.cells[3].textContent = "007";

        bodies.tbody.rows[2].tr.cells[0].textContent = "Puneet";
        bodies.tbody.rows[2].tr.cells[1].textContent = "12th";
        bodies.tbody.rows[2].tr.cells[2].textContent = "Computer Science";
        bodies.tbody.rows[2].tr.cells[3].textContent = "007";
      });

      ShowDataPromise.catch(() =>{
        document.querySelector('bodies').textContent = 'No Data Found';
      });
      
    </script>
