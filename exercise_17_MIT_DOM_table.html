<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Table</title>
    <style>
        * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      /* ******************** Variables / Assets ******************** */
      :root {
        /* Typography */
        --font-family-manrope: "Manrope", sans-serif;
        --font-family-inter: "Inter", sans-serif;
        --font-family-syne: "Syne", sans-serif;

        /* Typography Scale */
        --text-8px: 0.5rem; /* 8px */
        --text-12px: 0.75rem; /* 12px */
        --text-16px: 1rem; /* 16px */
        --text-20px: 1.25rem; /* 20px */
        --text-48px: 3rem; /* 48px */
        --text-155px: 155px;

        /* Font Colors */
        --text-black: black;
        --text-white: white;
        --text-pink: pink;
        --text-blue: rgb(67, 97, 250);
        --color-heading: rgb(135, 135, 135);

        /* Background Colors */
        --color-blue-bg: blue;
        --color-yellow-bg: yellow;
        --color-transparent-bg: transparent;
        --color-white-bg: white;
        --color-blur-bg: blur;
        --color-black-bg: black;

        /* Border Colors */
        --color-border-white: white;
        --color-border-gray: rgb(135, 135, 135);

        /* Semantic Colors */
        --color-error-red: #ef4444;
        --color-success-green: #22c55e;

        /* Spacing (4px base increasing by 4px) */
        --space-4px: 0.25rem;
        --space-8px: 0.5rem;
        --space-12px: 0.75rem;
        --space-16px: 1rem;
        --space-32px: 2rem; /* 32px */
        --margin-top-bottom: 10px 0px 10px 0px;

        /* radius and shadow */
        --radius-8px: 8px;
        --radius-12px: 12px;
        --radius-16px: 16px;
        --radius-20px: 20px;
        --radius-full: 100%;

        /* shadow color */
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);

        /* Transitions */
        --transition-fast: 200ms ease;
        --transition-smooth: 350ms cubic-bezier(0.4, 0, 0.2, 1);

        /* Z-Index Layers */
        --z-nav: 1000;
        --z-modal: 2000;
      }
      body{
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .container{
        display: flex;
        flex-direction: column;
        gap: var(--space-12px);
        font-family: var(--font-family-manrope);
        margin: 50px;
        font-weight: 100;
        width: 800px;
      }
      .heading{
        display: flex;
        flex-direction: column;
        gap: var(--space-16px);
      }
      .heading h1{
        font-weight: 500;
        letter-spacing: 4px;
      }
      .heading p{
        font-size: var(--text-16px);
      }
      .status{
        height: fit-content;
        width: 100%;
        border: 1px solid rgba(214, 226, 225);
        border-radius: var(--radius-8px);
        padding: 15px 10px;
      }
      table, thead, tbody, tr, th, td{
        border: 1px solid rgb(161, 244, 241);
        border-collapse: collapse;
        width: 100%;
      }
      th{
        text-align: left;
        padding: 10px 14px;
        font-size: var(--text-16px);
        font-weight: 700;
      }
      td{
        text-align: left;
        padding: 10px 14px;
        font-size: var(--text-12px);
      }
      thead{
        background-color: rgb(0, 255, 255, 0.3);
      }
    </style>
</head>
<body>
    <main class="container">
        <section class="heading">
            <h1>Employee Directory</h1>
            <p>Welcome to the company directory. Below you will find the current status and a list of active team members.</p>
        </section>
        <section class="status"><p><strong>System Status : </strong>Awaiting updates...</p></section>
        <section class="table">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Role</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Alice Johnson</td>
                        <td>Designer</td>
                    </tr>
                    <tr>
                        <td>Bob Smith</td>
                        <td>Developer</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    
</body>
</html>
