<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async & Await</title>
</head>
<body>

    <div class="image">
        <img src="" alt="">
    </div>


    <script>

        function first (){
            return new Promise((resolve, reject) => {
                setTimeout(()=>{
                    resolve();
                },3000);
            })
            .then(()=>{
                console.log("Hello World");
            })
        };



        async function number(){
            console.log('First');
            console.log('Second');
            console.log('Third');
            await  first();
            console.log('Fourth');
            console.log('Fifth');
        }

        number();

    </script>
    
</body>
</html>
