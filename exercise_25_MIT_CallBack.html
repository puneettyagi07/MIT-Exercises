<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call Back</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }
      .buttonSection {
        display: flex;
        gap: 15px;
      }
      button {
        height: fit-content;
        width: fit-content;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <h1>User Login System</h1>
    <div class="buttonSection">
      <button class="alert" onclick="alertBtn()">Log In(Alert)</button>
      <button class="console" onclick="consoleBtn">Log In(Console)</button>
      <button class="screen" onclick="screenBtn">Log In(Screen)</button>
    </div>

    <script>
      const alertBtn = document.querySelector(".alert");
      const consoleBtn = document.querySelector(".console");
      const screenBtn = document.querySelector(".screen");


    function hello(al,cn,sc){
        alertBtn.addEventListener("click",()=>{
           al()
        })
        consoleBtn.addEventListener("click",()=>{
            cn()
        })
        screenBtn.addEventListener("click",()=>{
            sc()
        })
    }

    hello(   ()=>{
      return alert("Hello World")
    }, ()=>{
        console.log("Hello World")
    },  ()=>{
        screenBtn.textContent="Hello World"
    }  )


    </script>
  </body>
</html>
