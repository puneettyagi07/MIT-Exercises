        const btn = document.querySelector('#getUserBtn');
        const detailsBox = document.querySelector('.details');

        // Step 2: Define the async function
        async function getRandomUser() {
            // Tell the user data is loading
            detailsBox.textContent = "Loading...";

            // 1. Get raw data from the server
            let response = await fetch("https://jsonplaceholder.typicode.com/users");

            // 2. Convert data into a readable JavaScript array
            let userList = await response.json();

            // 3. Pick a random index between 0 and the total users (0 to 9)
            let randomIndex = Math.floor(Math.random() * userList.length);
            let person = userList[randomIndex];

            // 4. Print that one person's data into the box
            detailsBox.innerHTML = `
                <p><strong>Name:</strong> ${person.name}</p>
                <p><strong>Email:</strong> ${person.email}</p>
                <p><strong>City:</strong> ${person.address.city}</p>
                <p><strong>Phone:</strong> ${person.phone}</p>
            `;
        }

        // Step 3: Run the function whenever the button is clicked
        btn.addEventListener('click', getRandomUser);
