<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM_EventListner</title>
    <link rel="stylesheet" href="exercise_20_MIT_BOM_EventListner.css">
</head>
<body>
    <main>
    <h1>Mouse Event Listners</h1>

    <div class="trackPad">Hover over me, click me, or move your mouse!</div>

    <div class="coordinates">
    <p>MOUSE Coordinates:</p>
    <div class="xAxis">X = <div class="xAxisValue"> 0 </div></div>
    <div class="yAxis">Y = <div class="yAxisValue"> 0 </div></div>
    </div>


    </main>
    <script>
    const trackPad = document.querySelector('.trackPad');
    const xAxisValue = document.querySelector('.xAxisValue');
    const yAxisValue = document.querySelector('.yAxisValue');
    const coordStatus = document.querySelector('.coordinates p');

    trackPad.addEventListener('mouseenter', () => {
        trackPad.style.backgroundColor = '#2a2472';
        trackPad.style.color = '#ffffff';
        trackPad.textContent = 'Mouse Entered';
    });

    document.addEventListener('mousemove', (event) => {
        coordStatus.textContent = 'Mouse Moving:';
        
        xAxisValue.textContent = `${event.offsetX}px`;
        yAxisValue.textContent = `${event.offsetY}px`;
    });

    trackPad.addEventListener('mouseleave', () => {
        trackPad.style.backgroundColor = 'rgb(24, 22, 72)';
        trackPad.style.color = 'rgb(136, 136, 140)';
        trackPad.textContent = 'Hover over me, click me, or move your mouse!';
        
        coordStatus.textContent = 'MOUSE Coordinates:';
        xAxisValue.textContent = '0px';
        yAxisValue.textContent = '0px';

    });




</script>


    
</body>
</html>
